<!-- ניתוב עמוקים ב-GitHub Pages: מפענח את הנתיב ש-404.html קידד בפרמטר query -->
<script>
(function (l) {
    if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
}(window.location));
</script>

<style>
:root {
    --bg: #f6f8f9;
    --surface: #ffffff;
    --surface-2: #f0f4f5;
    --ink: #16282c;
    --muted: #5f747a;
    --line: #e4eaec;
    --brand: #0f6e7c;
    --brand-ink: #0b5560;
    --brand-soft: #e6f2f3;
    --danger: #c8404f;
    --ok: #1c8c63;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --shadow-1: 0 1px 2px rgba(15, 40, 45, .05);
    --shadow-2: 0 10px 28px rgba(15, 80, 90, .10), 0 2px 6px rgba(15, 40, 45, .05);
    --bar-h: 64px;
    --tab-h: 62px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
    font-family: 'Assistant', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    font-size: 16px;
    min-height: 100vh;
    padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
}
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid rgba(15, 110, 124, .35); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- סרגל עליון ---------- */
.topbar {
    position: sticky; top: 0; z-index: 50;
    height: var(--bar-h);
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
}
.topbar-inner {
    max-width: 1080px; height: 100%; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: center; gap: 24px;
}
.brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.brand-mark {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, #1b93a3, var(--brand));
    color: #fff; display: grid; place-items: center; font-size: 17px;
}
.brand-name { font-weight: 800; font-size: 19px; letter-spacing: -.2px; }
.brand-name span { color: var(--brand); }
.nav { display: flex; gap: 4px; margin-inline-start: 8px; }
.nav a {
    padding: 8px 14px; border-radius: 999px; color: var(--muted);
    font-weight: 600; font-size: 15px; transition: background .15s, color .15s;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.active { background: var(--brand-soft); color: var(--brand-ink); }
.spacer { flex: 1; }

/* ---------- כפתורים ---------- */
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 15px;
    transition: background .15s, box-shadow .15s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(15, 110, 124, .25); }
.btn-primary:hover { background: var(--brand-ink); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-ghost:hover { background: #e6edef; }

/* ---------- משתמש ---------- */
.user-wrap { position: relative; }
.avatar {
    width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
}
.user-btn { border-radius: 50%; padding: 2px; border: 2px solid transparent; }
.user-btn:hover { border-color: var(--brand-soft); }
.menu {
    position: absolute; top: calc(100% + 10px); inset-inline-end: 0; min-width: 220px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    box-shadow: var(--shadow-2); padding: 8px; display: none;
}
.menu.open { display: block; }
.menu-head { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.menu-head b { display: block; font-size: 15px; }
.menu-head small { color: var(--muted); font-size: 13px; word-break: break-all; }
.menu-item {
    width: 100%; text-align: start; padding: 10px 12px; border-radius: var(--r-sm);
    display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px;
}
.menu-item:hover { background: var(--surface-2); }
.menu-item.danger { color: var(--danger); }

/* ---------- תוכן ---------- */
.container { max-width: 1080px; margin: 0 auto; padding: 28px 20px 40px; }
.page-title { font-size: 26px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 4px; }
.page-sub { color: var(--muted); margin-bottom: 22px; }
.section-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 18px; font-weight: 800; margin: 30px 0 14px;
}
.section-title a { color: var(--brand); font-size: 14px; font-weight: 700; }
.section-title a:hover { text-decoration: underline; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    box-shadow: var(--shadow-1);
}
.cat-card { display: block; padding: 18px; transition: transform .15s, box-shadow .15s, border-color .15s; }
.cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: #cfe1e4; }
.cat-icon {
    width: 44px; height: 44px; border-radius: 13px; background: var(--brand-soft);
    color: var(--brand); display: grid; place-items: center; font-size: 19px; margin-bottom: 14px;
}
.cat-card h3 { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
.cat-card p { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 42px; }
.cat-meta { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--brand-ink); }

.list { overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; transition: background .12s; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: #fafcfc; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 700; font-size: 16.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { color: var(--muted); font-size: 13.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.chip { background: var(--brand-soft); color: var(--brand-ink); padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.stats { display: flex; gap: 16px; color: var(--muted); font-size: 14px; font-weight: 600; flex-shrink: 0; }
.stats i { margin-inline-end: 5px; opacity: .7; }

.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty i { font-size: 30px; color: #b8c8cc; margin-bottom: 12px; display: block; }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
.skeleton { height: 76px; border-radius: var(--r-md); background: linear-gradient(90deg, #eef2f3 25%, #f6f9f9 50%, #eef2f3 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; margin-bottom: 12px; }
@keyframes shimmer { to { background-position: -200% 0; } }

.login-card { max-width: 420px; margin: 40px auto; padding: 36px 28px; text-align: center; }
.login-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.login-card p { color: var(--muted); margin-bottom: 22px; }
#g-btn { display: flex; justify-content: center; min-height: 44px; }

/* ---------- עמוד נושא ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.crumbs a:hover { color: var(--brand); }
.crumbs i { font-size: 10px; opacity: .6; }
.thread-head { padding: 22px 24px; margin-bottom: 16px; }
.thread-head h1 { font-size: 25px; font-weight: 800; line-height: 1.3; letter-spacing: -.3px; margin-bottom: 12px; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag { background: var(--surface-2); color: var(--muted); padding: 3px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.post { padding: 20px 22px; margin-bottom: 12px; scroll-margin-top: calc(var(--bar-h) + 16px); transition: box-shadow .3s, border-color .3s; }
.post.flash { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(15, 110, 124, .14); }
.post.is-deleted { background: var(--surface-2); }
.post-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.post-author { font-weight: 800; }
.post-time { color: var(--muted); font-size: 13px; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); margin-inline-start: 6px; }
.badge.warn { background: #fbe9ec; color: var(--danger); }
.sending { color: var(--muted); font-size: 12.5px; margin-inline-start: auto; }
.post-body { overflow-wrap: anywhere; font-size: 16.5px; line-height: 1.75; }
.post-body.muted { color: var(--muted); font-style: italic; }
.post-body h2, .post-body h3, .post-body h4 { margin: 10px 0 4px; line-height: 1.35; }
.post-body blockquote { border-inline-start: 3px solid var(--line); padding: 2px 12px; color: var(--muted); margin: 6px 0; }
.post-body code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: .92em; direction: ltr; unicode-bidi: embed; }
.post-body ul { padding-inline-start: 22px; margin: 6px 0; }
.post-body a { color: var(--brand); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.post-body a.mention { text-decoration: none; background: var(--brand-soft); padding: 0 6px; border-radius: 6px; }
.post-img { display: block; max-width: 100%; max-height: 460px; border-radius: var(--r-md); margin: 8px 0; cursor: zoom-in; }
.quote { display: block; border-inline-start: 3px solid var(--brand); background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 12px; font-size: 14.5px; color: var(--muted); cursor: pointer; overflow-wrap: anywhere; }
.quote b { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }
.post-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 14px; align-items: center; }
.act { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; color: var(--muted); font-weight: 700; font-size: 14px; transition: background .15s, color .15s; }
.act:hover { background: var(--surface-2); color: var(--ink); }
.act.on-like { background: #e3f5ee; color: var(--ok); }
.act.on-dislike { background: #fbe9ec; color: var(--danger); }
.act.danger:hover { background: #fbe9ec; color: var(--danger); }
.grow { flex: 1; }
.composer { padding: 18px; margin-top: 16px; }
.composer h3 { font-size: 16px; font-weight: 800; margin-bottom: 12px; }
.field { width: 100%; min-height: 100px; max-height: 55vh; resize: vertical; border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; background: #fff; line-height: 1.6; outline: none; transition: border-color .15s, box-shadow .15s; }
.field:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(15, 110, 124, .10); }
.composer-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 13px; }
.quote-pill { display: flex; gap: 10px; align-items: flex-start; border-inline-start: 3px solid var(--brand); background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
.quote-pill div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.quote-pill b { color: var(--ink); display: block; font-size: 13.5px; }
.notice { padding: 18px; text-align: center; color: var(--muted); margin-top: 16px; }
.overlay { position: fixed; inset: 0; z-index: 200; background: rgba(15, 30, 33, .45); display: grid; place-items: center; padding: 20px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: #fff; border-radius: var(--r-lg); padding: 26px; max-width: 380px; width: 100%; box-shadow: var(--shadow-2); }
.dialog h3 { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
.dialog p { color: var(--muted); }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #a93342; }
.btn-sm { padding: 8px 16px; font-size: 14px; }

/* ---------- ניווט תחתון (מובייל) ---------- */
.tabbar {
    display: none; position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(255, 255, 255, .96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
}
.tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; color: var(--muted); font-size: 11.5px; font-weight: 700;
}
.tabbar a i { font-size: 18px; }
.tabbar a.active { color: var(--brand); }

/* ---------- הודעות ---------- */
.toasts { position: fixed; inset-inline: 0; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
    background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 999px;
    font-weight: 600; font-size: 14.5px; box-shadow: var(--shadow-2); animation: pop .2s ease-out;
}
.toast.error { background: var(--danger); }
.toast.success { background: var(--ok); }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } }

@media (max-width: 760px) {
    .nav { display: none; }
    .tabbar { display: flex; }
    .topbar-inner { padding: 0 16px; gap: 12px; }
    .container { padding: 20px 16px 28px; }
    .page-title { font-size: 22px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .cat-card { padding: 14px; }
    .stats .st-views { display: none; }
    .thread-head { padding: 18px; }
    .thread-head h1 { font-size: 21px; }
    .post { padding: 16px; }
}
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } .brand-name { font-size: 17px; } }
</style>

            <span class="brand-name">פורום <span>נווה יעקב</span></span>
        </a>
        <nav class="nav" id="nav-desktop" aria-label="ניווט ראשי"></nav>
        <div class="spacer"></div>
        <div id="user-area"></div>
    </div>
</header>

<main class="container" id="app" aria-live="polite"></main>

<div class="toasts" id="toasts" role="status"></div>

<script>
'use strict';

/* ============ הגדרות (ללא שינוי מול הפורום הקיים) ============ */
const CFG = {
    API_URL: "https://script.google.com/macros/s/AKfycbx6TbORKoj_XXmOnbigtFQGc8Dmt94acTbOdb5pnEZ9YfYVlQJ2CeFrfFqb8GzGXEaD/exec",
    USERS_API_URL: "https://script.google.com/macros/s/AKfycby3d8oHPH-A3nZLfFlAnkegoYmBGPOtzoMEDrwgtYAacK7VjwLLHa_TZDaVjnsdb2k_iA/exec",
    ADMIN_EMAIL: "dh058328@gmail.com",
    GOOGLE_CLIENT_ID: "426523025549-7c50rkn7cun4vmm2r802u0ij6egjehtg.apps.googleusercontent.com",
    CAT: 'cat_',
    CACHE_KEY: 'forum_data_cache_v1',
    USER_KEY: 'forum_user'
};

const state = { posts: [], user: null, loading: true, loadError: false, lastLoad: 0, renderToken: 0, drafts: {}, quote: null, editing: null, editDraft: '', topicId: null, shownKey: '', pendingScroll: null };

/* ============ כלי עזר ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const safeJSON = (s, fallback = null) => { try { return JSON.parse(s); } catch (e) { return fallback; } };

function toast(msg, type = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 3200);
}

const PALETTE = ['#0f6e7c', '#e0674f', '#1c8c63', '#c8404f', '#c99318', '#1b93a3', '#a8508a', '#6d63c9', '#2563eb', '#c2410c', '#0d9488'];
function avatar(name, pic, size = 38) {
    const s = `width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px`;
    if (pic && /^https?:\/\//i.test(pic)) {
        return `<img class="avatar" style="${s}" src="${esc(pic)}" alt="" referrerpolicy="no-referrer" loading="lazy">`;
    }
    const n = String(name || '?').trim();
    let h = 0; for (const ch of n) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return `<span class="avatar" style="${s};background:${PALETTE[h % PALETTE.length]}">${esc(n.charAt(0) || '?')}</span>`;
}

/* ============ שכבת נתונים ============ */
async function request(url, opts = {}, timeout = 20000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeout);
    try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
    finally { clearTimeout(t); }
}

// שליחת פעולה לשרת עם ניסיונות חוזרים. check מאשר שהתשובה באמת מציינת הצלחה
async function apiPost(body, check = () => true, { retries = 2, delay = 800 } = {}) {
    for (let i = 0; i <= retries; i++) {
        try {
            const res = await request(CFG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                const json = await res.json().catch(() => null);
                if (check(json)) return true;
            }
        } catch (e) { /* ננסה שוב */ }
        if (i < retries) await wait(delay);
    }
    return false;
}
const api = {
    insert: rows => apiPost({ action: 'insert', data: rows }, j => !(j && j.error), { retries: 0 }),
    update: (column, value, data) => apiPost({ action: 'update', column, value, data }, j => j && j.updated > 0, { retries: 3 }),
    remove: (column, value) => apiPost({ action: 'delete', column, value }, j => j && j.deleted > 0)
};

// מחבר נתוני שרת עם פוסטים שעדיין ממתינים (עדכון אופטימי), ומשמר ציטוטים שחסרים בתשובה
function mergeServer(serverPosts) {
    const ids = new Set(serverPosts.map(p => p.id));
    const local = new Map(state.posts.map(p => [p.id, p]));
    serverPosts.forEach(sp => {
        const lp = local.get(sp.id);
        if (lp && lp.quote_content && !sp.quote_content) {
            sp.quote_id = lp.quote_id; sp.quote_author = lp.quote_author; sp.quote_content = lp.quote_content;
        }
    });
    return serverPosts.concat(state.posts.filter(p => p._status === 'pending' && !ids.has(p.id)));
}

function saveCache() {
    try {
        const clean = state.posts.filter(p => p._status !== 'pending').map(p => { const c = { ...p }; delete c._status; return c; });
        localStorage.setItem(CFG.CACHE_KEY, JSON.stringify(clean));
    } catch (e) {}
}

async function loadData() {
    const cached = safeJSON(localStorage.getItem(CFG.CACHE_KEY), null);
    if (Array.isArray(cached) && cached.length) {
        state.posts = cached;
        state.loading = false;
        render({ soft: true });
    }
    try {
        const res = await request(CFG.API_URL);
        const json = await res.json();
        if (!Array.isArray(json)) throw new Error('bad response');
        state.posts = mergeServer(json);
        state.loadError = false;
        saveCache();
    } catch (e) {
        state.loadError = !state.posts.length;
    }
    state.loading = false;
    state.lastLoad = Date.now();
    render({ soft: true });
}

const isCatId = id => String(id || '').indexOf(CFG.CAT) === 0;

function getCategories() {
    const map = {};

}
function getTopics() {
    const seen = new Set(), out = [];
    state.posts.forEach(p => {
        if (p.title && p.topic_id && !isCatId(p.topic_id) && !seen.has(p.topic_id) && (!isDeleted(p) || (state.user && state.user.isAdmin))) { seen.add(p.topic_id); out.push(p); }
    });

}
function replyCounts() {
    const m = {};

const sortedTopicIds = () => getTopics().map(t => t.topic_id).sort();
const topicNumber = id => { const i = sortedTopicIds().indexOf(id); return i < 0 ? '' : i + 1; };
const topicIdFromNumber = n => sortedTopicIds()[num(n) - 1] || null;
const categoryNumber = id => { const i = getCategories().findIndex(c => c.topic_id === id); return i < 0 ? '' : i + 1; };
const categoryIdFromNumber = n => (getCategories()[num(n) - 1] || {}).topic_id || null;
const sortedPostIds = () => { const s = new Set(); state.posts.forEach(p => { if (p.id && p.topic_id && !isCatId(p.topic_id)) s.add(p.id); }); return [...s].sort(); };
const postIdFromNumber = n => sortedPostIds()[num(n) - 1] || null;

/* ============ ניתוב ============ */
const ROUTE_TYPES = ['topic', 'post', 'category', 'user', 'tag', 'tags', 'users', 'latest', 'popular', 'login'];
const BASE = (() => {
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    let i = parts.findIndex(p => ROUTE_TYPES.includes(p));
    if (i === -1) i = parts.length;
    const base = parts.slice(0, i);
    return base.length ? '/' + base.join('/') : '';
})();
const hrefOf = path => BASE + path;

function parseRoute() {
    let path = location.pathname;
    path = path.indexOf(BASE) === 0 ? path.slice(BASE.length) : path;
    path = path.replace(/^\/+|\/+$/g, '').replace(/^index\.html$/i, '');
    if (!path && location.hash.length > 1) {            // תמיכה בקישורי hash ישנים
        const [t, id] = location.hash.slice(1).split('/');
        if (ROUTE_TYPES.includes(t) && id) { path = t + '/' + id; history.replaceState(null, '', hrefOf('/' + path)); }
    }
    const [type, raw] = path.split('/');
    let id = raw ? decodeURIComponent(raw) : '';
    if (type === 'topic' && /^\d+$/.test(id)) id = topicIdFromNumber(id) || id;
    if (type === 'category' && /^\d+$/.test(id)) id = categoryIdFromNumber(id) || id;
    if (type === 'post' && /^\d+$/.test(id)) id = postIdFromNumber(id) || id;
    return { type: ROUTE_TYPES.includes(type) ? type : 'home', id };
}
function go(path) {
    if (hrefOf(path) !== location.pathname) history.pushState(null, '', hrefOf(path));
    render({ nav: true });
}
window.addEventListener('popstate', () => render({ nav: true }));
document.addEventListener('click', e => {
    const a = e.target.closest('a[data-link]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    closeMenu();
    go(a.getAttribute('data-link'));
});

/* ============ תוכן, תאריכים והרשאות ============ */
function parseStoredDate(str) {
    const m = String(str || '').match(/(\d{1,2})\.(\d{1,2})\.(\d{4}),?\s*(\d{1,2}):(\d{2}):(\d{2})/);
    if (!m) return null;
    const [, d, mo, y, h, mi, s] = m.map(Number);
    return new Date(y, mo - 1, d, h, mi, s);
}
function timeAgo(str) {
    const d = parseStoredDate(str);
    if (!d || isNaN(d.getTime())) return String(str || '');
    const sec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (sec < 60) return 'לפני פחות מדקה';
    const min = Math.floor(sec / 60);
    if (min < 60) return min === 1 ? 'לפני דקה' : `לפני ${min} דקות`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr === 1 ? 'לפני שעה' : `לפני ${hr} שעות`;
    const day = Math.floor(hr / 24);
    if (day < 30) return day === 1 ? 'לפני יום' : `לפני ${day} ימים`;
    const mon = Math.floor(day / 30);
    if (mon < 12) return mon === 1 ? 'לפני חודש' : `לפני ${mon} חודשים`;
    const yr = Math.floor(mon / 12);
    return yr === 1 ? 'לפני שנה' : `לפני ${yr} שנים`;
}

// עיצוב טקסט: הטקסט עובר escape מלא לפני כל החלפה, ולכן אי אפשר להחדיר HTML
function inlineMd(s) {
    s = s.replace(/@\[([^\]]+)\]\(([^()\s]+)\)/g, (m, n, u) => `<a class="mention" href="${hrefOf('/user/' + u)}" data-link="/user/${u}">@${n}</a>`);
    s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img class="post-img" src="$2" alt="$1" loading="lazy">');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    return s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
}
function renderContent(str) {
    const out = [];
    let list = null;
    const flush = () => { if (list) { out.push({ b: true, h: '<ul>' + list.map(i => `<li>${i}</li>`).join('') + '</ul>' }); list = null; } };
    esc(String(str || '').replace(/\r/g, '')).split('\n').forEach(line => {
        let m;
        if ((m = line.match(/^- (.*)$/))) { (list = list || []).push(inlineMd(m[1])); return; }
        flush();
        if ((m = line.match(/^(#{1,3}) (.*)$/))) { const l = m[1].length + 1; out.push({ b: true, h: `<h${l}>${inlineMd(m[2])}</h${l}>` }); return; }
        if ((m = line.match(/^&gt; ?(.*)$/))) { out.push({ b: true, h: `<blockquote>${inlineMd(m[1])}</blockquote>` }); return; }
        out.push({ b: false, h: inlineMd(line) });
    });
    flush();
    return out.map((x, i) => (i > 0 && !x.b && !out[i - 1].b ? '<br>' : '') + x.h).join('');
}
const stripMd = (s, n = 200) => {
    const t = String(s || '').replace(/!\[[^\]]*\]\([^)]+\)/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[*_~`#>]/g, '').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
};
const emailEq = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();
const canManage = p => !!state.user && !!p && (state.user.isAdmin || emailEq(state.user.email, p.author_email));
function canReply(main) {
    if (!main || isDeleted(main)) return false;
    const list = String(main.allowed_emails || '').split(',').map(e => e.trim().toLowerCase()).filter(Boolean);
    if (!list.length) return true;
    return !!state.user && (state.user.isAdmin || list.includes(String(state.user.email).toLowerCase()));
}
const votes = {

};

function confirmDialog(title, text, okLabel = 'אישור', danger = true) {
    return new Promise(resolve => {
        const prev = document.activeElement;
        const ov = document.createElement('div');
        ov.className = 'overlay';
        ov.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${esc(title)}</h3><p>${esc(text)}</p>
            <div class="dialog-actions"><button type="button" class="btn btn-ghost btn-sm" data-r="0">ביטול</button><button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'} btn-sm" data-r="1">${esc(okLabel)}</button></div></div>`;
        const done = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); if (prev && prev.focus) prev.focus(); resolve(v); };
        const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); done(false); } };
        ov.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); else if (e.target === ov) done(false); });
        document.addEventListener('keydown', onKey, true);
        document.body.appendChild(ov);
        ov.querySelector('[data-r="0"]').focus();
    });
}

/* ---------- פעולות ---------- */
const voteQueue = {};
function votePost(id, type) {
    if (!state.user) { toast('יש להתחבר כדי להצביע', 'error'); return; }
    const post = state.posts.find(p => p.id === id);
    if (!post) return;
    const cur = votes.get(id), prev = { likes: num(post.likes), dislikes: num(post.dislikes) };
    let likes = prev.likes, dislikes = prev.dislikes;
    if (cur === type) { if (type === 'like') likes--; else dislikes--; }
    else { if (cur === 'like') likes--; if (cur === 'dislike') dislikes--; if (type === 'like') likes++; else dislikes++; }
    post.likes = Math.max(0, likes); post.dislikes = Math.max(0, dislikes);
    votes.set(id, cur === type ? null : type);
    paintPosts();
    // תור לכל הודעה: שמירות מהירות ברצף נשלחות לפי הסדר ולא דורסות זו את זו
    voteQueue[id] = (voteQueue[id] || Promise.resolve()).then(async () => {
        const ok = await api.update('id', id, { likes: post.likes, dislikes: post.dislikes });
        if (!ok) { post.likes = prev.likes; post.dislikes = prev.dislikes; votes.set(id, cur); paintPosts(); toast('שמירת ההצבעה נכשלה', 'error'); }
    });
}

function startQuote(id) {
    const post = state.posts.find(p => p.id === id);
    if (!post) return;
    const sel = window.getSelection(), el = document.getElementById('body-' + id);
    let text = '';
    if (sel && !sel.isCollapsed && el && el.contains(sel.anchorNode) && el.contains(sel.focusNode)) text = sel.toString();
    state.quote = { id, author: post.author_name || '', snippet: stripMd(text || post.content, 220) };
    paintComposer();
    const ta = $('#reply-input');
    if (ta) { ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); ta.focus({ preventScroll: true }); }
}

async function sendReply() {
    if (!state.user) { toast('יש להתחבר כדי להגיב', 'error'); return; }
    const { main } = threadData(state.topicId);
    if (!canReply(main)) { toast('אין לך הרשאה להגיב בנושא זה', 'error'); return; }
    const ta = $('#reply-input');
    const content = ta ? ta.value.trim() : '';
    if (!content) return;
    const q = state.quote, topicId = state.topicId;
    const post = {
        id: 'post_' + Date.now(), topic_id: topicId, title: '', category: '',
        author_name: state.user.name, author_email: state.user.email, author_avatar: state.user.picture,
        content, created_at: new Date().toLocaleString('he-IL'), likes: 0, dislikes: 0,
        quote_id: q ? q.id : '', quote_author: q ? q.author : '', quote_content: q ? q.snippet : '', _status: 'pending'
    };
    state.posts.push(post);
    state.drafts[topicId] = ''; state.quote = null;
    paintComposer(); paintPosts(); paintHead();
    scrollToPost(post.id);
    const ok = await api.insert([post]);
    if (ok) {
        post._status = null;
        saveCache();
        if (state.topicId === topicId) paintPosts();
    } else {
        state.posts = state.posts.filter(x => x !== post);
        state.drafts[topicId] = content; state.quote = q;
        if (state.topicId === topicId) { paintComposer(); paintPosts(); paintHead(); }
        toast('השליחה נכשלה, התגובה נשמרה בתיבה. נסו שוב', 'error');
    }
}

async function saveEdit(id) {
    const post = state.posts.find(p => p.id === id);
    const content = ($('#edit-field') || {}).value ? $('#edit-field').value.trim() : state.editDraft.trim();
    if (!post || !content) return;
    const prev = post.content;
    post.content = content; state.editing = null; paintPosts();
    const ok = await api.update('id', id, { content });
    if (ok) { toast('ההודעה עודכנה', 'success'); saveCache(); }
    else { post.content = prev; paintPosts(); toast('העדכון נכשל, נסו שוב', 'error'); }
}

async function deletePost(id) {
    const post = state.posts.find(p => p.id === id);
    if (!post) return;
    const isMain = !!post.title;
    const yes = await confirmDialog(isMain ? 'מחיקת נושא' : 'מחיקת הודעה', isMain ? 'הנושא יוסתר מהפורום. אפשר יהיה לשחזר אותו.' : 'ההודעה תוסתר. אפשר יהיה לשחזר אותה.', 'מחיקה');
    if (!yes) return;
    const prev = post.deleted;
    post.deleted = 'X';
    paintPosts(); paintHead();
    if (isMain && !state.user.isAdmin) go('/');
    const ok = await api.update('id', id, { deleted: 'X' });
    if (ok) { toast(isMain ? 'הנושא נמחק' : 'ההודעה נמחקה', 'success'); saveCache(); }
    else { post.deleted = prev; if ($('#thread-posts')) { paintPosts(); paintHead(); } toast('המחיקה נכשלה, נסו שוב', 'error'); }
}

async function restorePost(id) {
    const post = state.posts.find(p => p.id === id);
    if (!post || !canManage(post)) return;
    post.deleted = ''; paintPosts(); paintHead();
    const ok = await api.update('id', id, { deleted: '' });
    if (ok) { toast('ההודעה שוחזרה', 'success'); saveCache(); }
    else { post.deleted = 'X'; paintPosts(); paintHead(); toast('השחזור נכשל, נסו שוב', 'error'); }
}

/* ---------- אירועים ---------- */
document.addEventListener('mousedown', e => { if (e.target.closest('[data-act="quote"]')) e.preventDefault(); });   // שומר על הטקסט המסומן
document.addEventListener('click', e => {
    const img = e.target.closest('.post-img');
    if (img) { window.open(img.src, '_blank', 'noopener'); return; }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = b.dataset.id;
    switch (b.dataset.act) {
        case 'vote': votePost(id, b.dataset.type); break;
        case 'quote': startQuote(id); break;
        case 'cancel-quote': state.quote = null; paintComposer(); break;
        case 'goto': scrollToPost(id); break;
        case 'send': sendReply(); break;
        case 'edit': { const p = state.posts.find(x => x.id === id); if (p) { state.editing = id; state.editDraft = p.content || ''; paintPosts(); const f = $('#edit-field'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } } break; }
        case 'edit-cancel': state.editing = null; paintPosts(); break;
        case 'edit-save': saveEdit(id); break;
        case 'delete': deletePost(id); break;
        case 'restore': restorePost(id); break;
    }
});
document.addEventListener('input', e => {
    if (e.target.id === 'reply-input') state.drafts[state.topicId] = e.target.value;
    if (e.target.id === 'edit-field') state.editDraft = e.target.value;
});
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        if (e.target.id === 'reply-input') { e.preventDefault(); sendReply(); }
        if (e.target.id === 'edit-field') { e.preventDefault(); saveEdit(state.editing); }
    }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('.quote[data-act]')) e.target.click();
});

/* ============ מסכים ============ */
const views = {
    home() {
        const cats = getCategories(), counts = {};
        getTopics().forEach(t => { counts[t.category] = (counts[t.category] || 0) + 1; });
        const latest = getTopics().sort(byLatest).slice(0, 8);
        const catHTML = cats.length ? `<div class="grid">${cats.map(c => {
            const icon = /^fa-[a-z0-9-]+$/.test(c.category || '') ? c.category : 'fa-comments';
            const n = counts[c.topic_id] || 0, p = categoryNumber(c.topic_id) || encodeURIComponent(c.topic_id);
            return `<a class="card cat-card" href="${hrefOf('/category/' + p)}" data-link="/category/${p}">
                <div class="cat-icon"><i class="fa-solid ${icon}"></i></div>
                <h3>${esc(c.title)}</h3><p>${esc(c.content || '')}</p>
                <div class="cat-meta">${n} ${n === 1 ? 'נושא' : 'נושאים'}</div></a>`;
        }).join('')}</div>` : `<div class="card empty"><i class="fa-regular fa-folder-open"></i><b>אין עדיין קטגוריות</b></div>`;
        return `<h1 class="page-title">ברוכים הבאים לפורום</h1><p class="page-sub">הקהילה הדיגיטלית של השכונה</p>
            <div class="section-title">קטגוריות</div>${catHTML}
            <div class="section-title">נושאים אחרונים <a href="${hrefOf('/latest')}" data-link="/latest">לכל הנושאים</a></div>${topicList(latest)}`;
    },
    latest() {
        return `<h1 class="page-title">נושאים אחרונים</h1><p class="page-sub">הנושאים החדשים ביותר בפורום</p>` +
            topicList(getTopics().sort(byLatest));
    },
    popular() {
        return `<h1 class="page-title">נושאים פופולריים</h1><p class="page-sub">לפי מספר הצפיות</p>` +
            topicList(getTopics().sort((a, b) => num(b.views) - num(a.views) || topicStamp(b) - topicStamp(a)));
    },
    category({ id }) {
        const cat = getCategories().find(c => c.topic_id === id);
        if (!cat) return `<div class="card empty"><i class="fa-regular fa-circle-question"></i><b>הקטגוריה לא נמצאה</b><a class="btn btn-primary" style="margin-top:14px" href="${hrefOf('/')}" data-link="/">חזרה לדף הבית</a></div>`;
        return `<h1 class="page-title">${esc(cat.title)}</h1><p class="page-sub">${esc(cat.content || '')}</p>` +
            topicList(getTopics().filter(t => t.category === id).sort(byLatest));
    },
    login() {
        if (state.user) { setTimeout(() => go('/'), 0); return ''; }
        setTimeout(mountGoogleButton, 0);
        return `<div class="card login-card"><h2>התחברות לפורום</h2><p>התחברו עם חשבון גוגל כדי לפתוח נושאים ולהגיב.</p><div id="g-btn"></div></div>`;
    },
    topic: topicView,
    post: postView,
    user() { return soon('פרופיל משתמש'); },
    users() { return soon('משתמשים'); },
    tags() { return soon('תגיות'); },
    tag() { return soon('תגית'); }
};

function render(opts = {}) {
    const route = parseRoute();
    const token = ++state.renderToken;
    renderNav(route.type);
    renderUser();
    const app = $('#app');
    if (state.loading && !state.posts.length && route.type !== 'login') { app.innerHTML = skeletons(5); state.shownKey = ''; return; }
    if (state.loadError && route.type !== 'login') {
        app.innerHTML = `<div class="card empty"><i class="fa-solid fa-wifi"></i><b>לא הצלחנו לטעון את הפורום</b>בדקו את החיבור ונסו שוב.<br><button class="btn btn-primary" id="retry" style="margin-top:16px">נסו שוב</button></div>`;
        state.shownKey = '';
        $('#retry').onclick = () => { state.loading = true; state.loadError = false; render(); loadData(); };
        return;
    }
    const key = route.type + ':' + route.id;
    // רענון שקט של נושא פתוח: מעדכנים רק את מה שהשתנה, בלי לפגוע בטיוטה, בעריכה או במיקום הגלילה
    if (opts.soft && (route.type === 'topic' || route.type === 'post') && state.shownKey === key && $('#thread-posts')) {
        paintHead();
        if (!state.editing) paintPosts();
        const ta = $('#reply-input');
        if (opts.composer || !ta || document.activeElement !== ta) paintComposer();
        return;
    }
    const html = (views[route.type] || views.home)(route);
    if (token !== state.renderToken) return;
    app.innerHTML = html;
    state.shownKey = key;
    if (opts.nav) window.scrollTo(0, 0);
    if ((route.type === 'topic' || route.type === 'post') && $('#thread-posts')) {
        const { main } = threadData(state.topicId);
        if (main) registerView(main);
        if (state.pendingScroll) { const id = state.pendingScroll; state.pendingScroll = null; setTimeout(() => scrollToPost(id), 60); }
    }
}

/* ============ משתמש והתחברות ============ */
function renderUser() {
    const box = $('#user-area');
    const u = state.user;
    if (!u) {
        box.innerHTML = `<a class="btn btn-primary" href="${hrefOf('/login')}" data-link="/login"><i class="fa-brands fa-google"></i>התחברות</a>`;
        return;
    }
    box.innerHTML = `<div class="user-wrap">
        <button class="user-btn" id="user-btn" aria-haspopup="true" aria-expanded="false" aria-label="תפריט משתמש">${avatar(u.name, u.picture, 38)}</button>
        <div class="menu" id="user-menu" role="menu">
            <div class="menu-head"><b>${esc(u.name)}</b><small>${esc(u.email)}</small></div>
            <button class="menu-item danger" id="logout-btn" role="menuitem"><i class="fa-solid fa-right-from-bracket"></i>התנתקות</button>
        </div></div>`;
    $('#user-btn').onclick = e => { e.stopPropagation(); const m = $('#user-menu'); const open = m.classList.toggle('open'); $('#user-btn').setAttribute('aria-expanded', open); };
    $('#logout-btn').onclick = logout;
}
function closeMenu() { const m = $('#user-menu'); if (m) { m.classList.remove('open'); $('#user-btn').setAttribute('aria-expanded', 'false'); } }
document.addEventListener('click', e => { if (!e.target.closest('.user-wrap')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

function parseJwt(token) {
    try {
        const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder('utf-8').decode(bytes));   // פענוח UTF-8 תקין לשמות בעברית
    } catch (e) { return null; }
}
function onCredential(resp) {
    const d = parseJwt(resp.credential);
    if (!d || !d.email) { toast('ההתחברות נכשלה, נסו שוב', 'error'); return; }
    const prev = safeJSON(localStorage.getItem(CFG.USER_KEY), null);
    const same = prev && prev.email === d.email ? prev : null;
    state.user = {
        name: same && same.name ? same.name : d.name,
        email: d.email,
        picture: same && same.picture ? same.picture : d.picture,
        isAdmin: d.email === CFG.ADMIN_EMAIL,
        registered: same ? !!same.registered : false,
        address: same ? same.address : undefined
    };
    localStorage.setItem(CFG.USER_KEY, JSON.stringify(state.user));
    toast('התחברת בהצלחה', 'success');
    if (parseRoute().type === 'login') go('/'); else render({ soft: true, composer: true });
}
function logout() {
    state.user = null;
    localStorage.removeItem(CFG.USER_KEY);
    if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
    toast('התנתקת מהחשבון');
    render({ soft: true, composer: true });
}
let gReady = false;
async function initGoogle() {
    for (let i = 0; i < 50 && !(window.google && google.accounts && google.accounts.id); i++) await wait(200);
    if (!(window.google && google.accounts && google.accounts.id)) return;
    google.accounts.id.initialize({ client_id: CFG.GOOGLE_CLIENT_ID, callback: onCredential });
    gReady = true;
    if (parseRoute().type === 'login') mountGoogleButton();
}
async function mountGoogleButton() {
    const box = $('#g-btn');
    if (!box) return;
    for (let i = 0; i < 50 && !gReady; i++) await wait(200);
    if (!gReady) { box.innerHTML = '<span style="color:var(--muted)">שירות ההתחברות של גוגל לא נטען. רעננו את העמוד ונסו שוב.</span>'; return; }
    if ($('#g-btn') === box) google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: 'he', width: 280 });
}

/* ============ אתחול ============ */
state.user = safeJSON(localStorage.getItem(CFG.USER_KEY), null);
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - state.lastLoad > 60000 && !state.loading) loadData();
});
render();
loadData();
initGoogle();
</script>
</body>
